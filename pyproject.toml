[project]
name = "numdaplot"
version = "0.2.0rc2"
description = "A typed API for arrays, tables and plots, built on numpy, pandas and matplotlib."
keywords = ["numpy", "pandas", "matplotlib", "data analysis", "plotting"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
	{ name = "Ryieru" },
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering",
	"Typing :: Typed",
]
dependencies = [
	"numpy>=2.2,<3",
	"pandas>=2.3,<4",
	"matplotlib>=3.10.7,<4",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.3,<4"]
parquet = ["pyarrow>=18.1"]

[project.urls]
Repository = "https://github.com/Ryieru/numdaplot"
Documentation = "https://ryieru.github.io/numdaplot/"
Changelog = "https://github.com/Ryieru/numdaplot/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ryieru/numdaplot/issues"

[dependency-groups]
dev = [
	"pytest>=9.0",
	"ruff>=0.17",
	"pyright>=1.1.414",
	"pandas-stubs>=2.3.3.251201",
	"mkdocs-material>=9.8",
	"mkdocstrings[python]>=1.0.7",
	"coverage>=7.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numdaplot"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "tools"]
pythonpath = ["tools/docs"]
addopts = ["--doctest-modules", "--import-mode=importlib", "--ignore=tools/checks"]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]
filterwarnings = ["ignore::numdaplot.errors.warnings.display_warning.DisplayWarning"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tools/checks/*"]

[tool.coverage.report]
fail_under = 99.5
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["W191", "D206", "E101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["src", "tests", "tools", "run_tests.py", "conftest.py"]
extraPaths = ["tools/docs"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
