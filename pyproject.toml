[project]
name = "numdaplot"
version = "0.1.0"
description = "A simpler, explicit API over numpy, pandas and matplotlib."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
	{ name = "Ryieru" },
]
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.13",
	"Topic :: Scientific/Engineering",
	"Typing :: Typed",
]
dependencies = [
	"numpy>=2.2,<3",
	"pandas>=2.3,<4",
	"matplotlib>=3.10,<4",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
parquet = ["pyarrow>=18.1"]

[project.urls]
Repository = "https://github.com/Ryieru/Numdaplot"

[dependency-groups]
dev = [
	"pytest>=9.0",
	"ruff>=0.17",
	"pyright>=1.1.414",
	"pandas-stubs>=2.3.3.251201",
	"mkdocs-material>=9.8",
	"mkdocstrings[python]>=1.0.7",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numdaplot"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["W191", "D206"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["src", "tests", "run_tests.py"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
