site_name: numdaplot
site_description: A simpler, explicit API over numpy, pandas and matplotlib.
repo_url: https://github.com/Ryieru/Numdaplot

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - API:
      - Arrays: api/arrays.md
      - Tables: api/tables.md
      - Types: api/data_types.md
      - Rules: api/rules.md
      - Statistics: api/statistics.md
      - Positions: api/positions.md
      - Sort settings: api/ordering.md
      - Errors: api/errors.md
  - Changelog: changelog.md

markdown_extensions:
  - pymdownx.snippets:
      check_paths: true
