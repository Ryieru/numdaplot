site_name: numdaplot
site_description: A typed API for arrays, tables and plots, built on numpy, pandas and matplotlib.
site_url: https://ryieru.github.io/numdaplot/
repo_url: https://github.com/Ryieru/numdaplot

watch:
  - src

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

hooks:
  - tools/docs/api_pages.py
  - tools/docs/section_separators.py
  - tools/docs/page_references.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: list
            show_source: true
            members_order: source
            group_by_category: true
            show_category_heading: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: false
            show_signature_annotations: false
            annotations_path: source
            show_labels: false
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: true
            filters:
              - "!^_[^_]"
              - "!^__init__$"
              - "!^__post_init__$"
            extensions:
              - tools/docs/figure_images.py
              - tools/docs/example_code.py
              - tools/docs/version_directives.py
              - tools/docs/tab_indentation.py
              - tools/docs/default_values.py
              - tools/docs/cross_references.py
              - tools/docs/public_bases.py

nav:
  - Home: index.md
  - Changelog: changelog.md
  - Development:
      - Development: development.md
      - Releasing: releasing.md

extra_css:
  - stylesheets/symbols.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
