name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Python ${{ matrix.python }} - ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            dependencies: latest
            resolution: highest
          - python: "3.13"
            dependencies: minimum
            resolution: lowest-direct
          - python: "3.14"
            dependencies: latest
            resolution: highest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve dependencies
        run: uv lock --resolution ${{ matrix.resolution }} --upgrade
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen pyright
      - name: Tests
        run: uv run --frozen python run_tests.py
      - name: Documentation
        run: uv run --frozen mkdocs build --strict
